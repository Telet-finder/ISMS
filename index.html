<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ISMS - Ice Sculpture Melting Simulator</title>
<style>
  :root{ --ink:#e8f4ff; --sub:#8fa9c2; --ice:#8fd3ff; --ice2:#cdeeff; --warm:#ff9a52;
    --glass:rgba(14,24,36,.58); --line:rgba(160,210,255,.16); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#070c13;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(2,5,9,.75) 100%)}
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .floater{position:absolute;left:0;top:0;font-weight:800;font-size:17px;color:var(--warm);white-space:nowrap;
    text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:-.3px}
  .off{opacity:0;pointer-events:none!important;visibility:hidden}

  /* 타이틀 */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 9vw;
    background:linear-gradient(90deg,rgba(5,9,15,.92) 0%,rgba(5,9,15,.55) 55%,rgba(5,9,15,0) 100%);
    transition:opacity .6s,visibility .6s;z-index:5}
  .logo{font-size:clamp(64px,13vw,132px);font-weight:900;letter-spacing:.06em;line-height:.95;
    background:linear-gradient(180deg,#ffffff 0%,#bfe6ff 45%,#5fb4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 30px rgba(95,180,255,.35))}
  .stack{margin-top:18px;display:flex;flex-direction:column;gap:2px;font-size:clamp(16px,2.6vw,24px);font-weight:300;letter-spacing:.32em;color:var(--sub)}
  .stack b{font-weight:800;color:var(--ice2)}
  .tsub{margin:22px 0 28px;color:var(--sub);font-size:14px;letter-spacing:.02em}
  #start{align-self:flex-start;font:inherit;font-size:16px;font-weight:700;color:#06121e;padding:14px 34px;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,#e6f6ff,#8fd3ff);box-shadow:0 8px 30px rgba(95,180,255,.35)}
  #start:active{transform:scale(.97)}

  /* HUD */
  #hud{transition:opacity .5s}
  .panel{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:16px;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
  .tl{top:max(12px,env(safe-area-inset-top));left:12px;padding:12px 14px;width:min(300px,calc(100vw - 24px - 150px))}
  .brand{font-weight:900;letter-spacing:.18em;font-size:13px;color:var(--ice)}
  .brand span{font-weight:400;color:var(--sub);letter-spacing:.08em;margin-left:6px;font-size:10px}
  #sname{font-size:17px;font-weight:700;margin:6px 0 8px}
  .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  #prog{height:100%;width:100%;background:linear-gradient(90deg,#5fb4ff,#cdeeff);transition:width .15s}
  .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}
  .tr{top:max(12px,env(safe-area-inset-top));right:12px;padding:10px 14px;text-align:right;min-width:130px}
  #water{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ice2)}
  .lbl{font-size:11px;color:var(--sub)}
  .wrow{display:flex;align-items:center;justify-content:flex-end;gap:8px}
  .drop{width:.75em;height:1em;vertical-align:-.12em;margin-right:3px;filter:drop-shadow(0 1px 4px rgba(79,168,238,.45))}
  .drop.big{width:18px;height:24px;margin:0}
  .floater{display:flex;align-items:center;gap:2px}
  .stat2{font-size:11px;color:var(--sub);margin-top:4px}
  .stat2 b{color:var(--ink);font-weight:600}

  #shopWrap{right:12px;bottom:max(12px,env(safe-area-inset-bottom));top:auto;width:300px;padding:12px;max-height:calc(100vh - 140px);overflow:auto}
  #shopWrap h2{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  #shop{display:flex;flex-direction:column;gap:8px}
  .item{text-align:left;font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .item:hover:not(:disabled){border-color:rgba(143,211,255,.6);background:rgba(143,211,255,.08)}
  .item:active:not(:disabled){transform:scale(.98)}
  .item:disabled{opacity:.42;cursor:not-allowed}
  .item .n{font-weight:700;font-size:14px}
  .item .d{font-size:11px;color:var(--sub);margin:3px 0 6px;line-height:1.4}
  .item .row{display:flex;justify-content:space-between;font-size:12px}
  .item .c{font-weight:800;color:var(--ice);font-variant-numeric:tabular-nums}
  .item .lv{color:var(--sub)}
  .tools{display:flex;gap:6px;margin-top:10px;align-items:center}
  .tools .sp{flex:1;font-size:11px;color:var(--sub)}
  .btn{font:inherit;font-size:11px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:rgba(143,211,255,.5)}
  #shopToggle{display:none}
  #hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:var(--sub);
    background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;transition:opacity .8s}
  #toast{position:fixed;left:50%;top:max(84px,calc(env(safe-area-inset-top) + 84px));transform:translateX(-50%) translateY(-12px);opacity:0;
    background:rgba(10,18,28,.85);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:13px;
    transition:opacity .3s,transform .3s;z-index:9;max-width:92vw;text-align:center;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    #shopToggle{display:block;position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));font-size:13px;font-weight:700;color:#06121e;
      background:linear-gradient(180deg,#e6f6ff,#8fd3ff);border:0;border-radius:999px;padding:11px 18px;z-index:4}
    #shopWrap{left:8px;right:8px;width:auto;bottom:max(64px,calc(env(safe-area-inset-bottom) + 64px));max-height:46vh;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
    body.shop-open #shopWrap{transform:none;opacity:1;pointer-events:auto}
    #shop{flex-direction:row;overflow-x:auto;padding-bottom:4px}
    .item{min-width:168px}
    #hint{bottom:max(70px,calc(env(safe-area-inset-bottom) + 70px));font-size:11px}
    .tr{min-width:0}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div id="fx"></div>

<div id="title">
  <div class="logo">ISMS</div>
  <div class="stack">
    <span><b>I</b>CE</span>
    <span><b>S</b>CULPTURE</span>
    <span><b>M</b>ELTING</span>
    <span><b>S</b>IMULATOR</span>
  </div>
  <div class="tsub">얼음조각상 녹이기 시뮬레이터</div>
  <button id="start">시작하기</button>
</div>

<div id="hud" class="off">
  <div class="panel tl">
    <div class="brand">ISMS<span>ICE SCULPTURE MELTING SIMULATOR</span></div>
    <div id="sname">하트 조각상</div>
    <div class="bar"><div id="prog"></div></div>
    <div class="meta"><span>남은 조각상</span><span id="pct">100%</span></div>
  </div>
  <div class="panel tr">
    <div class="wrow"><svg class="drop big" viewBox="0 0 24 32" aria-label="물방울"><defs><linearGradient id="dg0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f6ff"/><stop offset="1" stop-color="#4fa8ee"/></linearGradient></defs><path d="M12 1C12 1 2 13.5 2 20.5a10 10 0 0 0 20 0C22 13.5 12 1 12 1z" fill="url(#dg0)"/><ellipse cx="8" cy="20" rx="2.2" ry="3.4" fill="#fff" opacity=".55"/></svg><span id="water">0</span></div>
    <div class="stat2">출력 <b id="pow">0</b> · 범위 <b id="rad">0</b></div>
  </div>
  <div class="panel" id="shopWrap">
    <h2>열원 강화</h2>
    <div id="shop"></div>
    <div class="tools"><span class="sp" id="count">녹인 조각상 0개</span><button class="btn" id="mute">소리 끄기</button><button class="btn" id="reset">처음부터</button></div>
  </div>
  <button id="shopToggle">강화</button>
  <div id="hint">조각상을 누른 채 문질러 가열 · 빈 곳을 끌어 회전 · 휠/핀치로 확대</div>
</div>
<div id="toast"></div>
